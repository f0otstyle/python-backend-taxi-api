name: CI

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U pgAdmin && break
            sleep 2
          done

      - name: Start application
        run: docker compose up -d app

      - name: Wait for application
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8090/docs > /dev/null && break
            sleep 2
          done

      - name: Install pytest
        run: pip install pytest requests

      - name: Run tests
        run: pytest -v

      - name: Stop containers
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . || true